[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diaryze"
version = "0.1.2"
description = "Transcribe and diarize a folder of audio recordings into searchable Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
diaryze = "diarizer.cli:main"

[tool.setuptools]
packages = ["diarizer", "diarizer.platform", "diarizer.prompt_resources"]

[tool.setuptools.package-dir]
diarizer = "scripts/diarizer"
"diarizer.prompt_resources" = "prompts"

[tool.setuptools.package-data]
"diarizer.prompt_resources" = ["*.md"]
