name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfaad2
      - if: runner.os == 'macOS'
        run: brew install ffmpeg faad2
      - run: python -m pip install .
      - name: Check native AAC recovery is available
        run: python -c 'from diarizer.audio import _get_libfaad; assert _get_libfaad(), "FAAD2 was not loaded"'
      - run: diaryze --selftest
      - run: python -m unittest discover -s scripts/tests -q
