name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        timeout-minutes: 3
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg libfaad2
      - if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg faad2
      - run: python -m pip install .
      - name: Check native AAC recovery is available
        run: python -c 'from diarizer.audio import _get_libfaad; assert _get_libfaad(), "FAAD2 was not loaded"'
      - run: diaryze --selftest
      - name: Recover a synthetic M4A without untrunc
        timeout-minutes: 1
        run: python -m unittest scripts.tests.test_diarizer.AudioTests.test_truncated_aac_needs_recovery_without_tools_and_recovers_with_faad -v
      - name: Run the full suite
        timeout-minutes: 2
        run: python -m unittest discover -s scripts/tests -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: choco install ffmpeg --yes --no-progress
      - run: ffmpeg -version
      - run: python -m pip install .
      - run: diaryze --selftest
      - name: Check Windows processes, locks, and the archive workflow
        run: python -m unittest -v scripts.tests.test_platform_ops scripts.tests.test_markdown scripts.tests.test_diarizer.ArchiveTests scripts.tests.test_diarizer.PipelineTests scripts.tests.test_voice_samples scripts.tests.test_find
